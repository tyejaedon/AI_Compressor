name: CI

# Lightweight checks only: no model training, no dataset dependency.
# Real validation happens locally via smokeTests/* and human PR review
# (see CONTRIBUTING.md).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Byte-compile all Python sources (syntax check)
        run: |
          python -m compileall -q .

      - name: Ruff lint (non-blocking style check)
        run: |
          ruff check . --exit-zero

